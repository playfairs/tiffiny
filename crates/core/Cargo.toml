[package]
name = "tiffiny-core"
version = "0.1.0"
edition = "2021"
description = "Core functionality for Tiffiny Studio"
authors = ["Tiffiny Studio Development Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
num-traits = "0.2"
num-derive = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"