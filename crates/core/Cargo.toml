[package]
name = "tiffiny-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "Core functionality for Tiffiny Studio"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
num-traits = "0.2"
num-derive = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
flate2 = "1.0"
dirs = "5.0"
num_cpus = "1.16"
