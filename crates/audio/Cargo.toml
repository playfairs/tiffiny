[package]
name = "tiffiny-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "Audio processing and playback for Tiffiny Studio"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.19", features = ["wav", "vorbis", "flac"] }

rustfft = "6.1"
dasp = "0.11"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }

tiffiny-core = { path = "../core" }
