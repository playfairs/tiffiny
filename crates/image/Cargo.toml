[package]
name = "tiffiny-image"
version = "0.1.0"
edition = "2021"
description = "Image processing and manipulation for Tiffiny Studio"
authors = ["Tiffiny Studio Development Team"]
license = "MIT"

[dependencies]
image = { version = "0.24", features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }
imageproc = "0.23"

fast_image_resize = "4.0"
rgb = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
num-complex = "0.4"

tiffiny-core = { path = "../core" }
