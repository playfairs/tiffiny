[package]
name = "tiffiny-convert"
version = "0.1.0"
edition = "2021"
description = "Media conversion pipelines for Tiffiny Studio"
authors = ["Tiffiny Studio Development Team"]
license = "MIT"

[dependencies]
tiffiny-audio = { path = "../audio" }
tiffiny-image = { path = "../image" }
tiffiny-video = { path = "../video" }
tiffiny-raw = { path = "../raw" }

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "1.0"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
num-traits = "0.2"
num-derive = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

walkdir = "2.3"
glob = "0.3"

indicatif = "0.17"

config = "0.13"
