[package]
name = "tiffiny-convert"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "Media conversion pipelines for Tiffiny Studio"

[dependencies]
tiffiny-audio = { path = "../audio" }
tiffiny-image = { path = "../image" }
tiffiny-video = { path = "../video" }
tiffiny-raw = { path = "../raw" }

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
num-traits = "0.2"
num-derive = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

walkdir = "2.3"
glob = "0.3"

indicatif = "0.17"

config = "0.13"
