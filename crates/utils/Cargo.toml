[package]
name = "tiffiny-utils"
version = "0.1.0"
edition = "2021"
authors = ["playfairs"]
description = "Common utilities for Tiffiny Studio"
license = "GPL-3.0"
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
keywords = ["utilities", "helpers", "common"]
categories = ["development-tools"]

[dependencies]
tiffiny-core = { path = "../core" }

tokio = { version = "1.35", features = ["full"] }

anyhow = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
base64 = "0.21"
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"

tempfile = "3.8"
walkdir = "2.4"
glob = "0.3"

sha2 = "0.10"
md5 = "0.7"

flate2 = "1.0"
zstd = "0.13"

rand = "0.8"

num-traits = "0.2"
ordered-float = "4.2"

sysinfo = "0.30"
num_cpus = "1.16"

path-absolutize = "3.1"
normalize-path = "0.1"

unicode-normalization = "0.1"
slug = "0.1"

humantime = "2.1"
duration-str = "0.5"

byteorder = "1.5"
bytes = "1.5"

config = "0.13"

indicatif = "0.17"

colored = "2.1"
console = "0.15"
termcolor = "1.4"

tabled = "0.15"

miette = { version = "7.2", features = ["fancy"] }

clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
dialoguer = "0.11"

reqwest = { version = "0.11", features = ["json"] }

bincode = "1.3"
rmp-serde = "1.1"

futures = "0.3"
async-trait = "0.1"

lru = "0.12"

metrics = "0.23"

[features]
default = ["std"]
std = []
no-std = []
