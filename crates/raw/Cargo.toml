[package]
name = "tiffiny-raw"
version = "0.1.0"
edition = "2021"
description = "Raw binary data manipulation for Tiffiny Studio"
authors = ["Tiffiny Studio Development Team"]
license = "MIT"

[dependencies]
byteorder = "1.4"
crc = "3.0"
hex = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

flate2 = "1.0"
lz4 = "1.24"
zstd = "0.13"

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
num-traits = "0.2"
num-derive = "0.4"

tiffiny-core = { path = "../core" }
