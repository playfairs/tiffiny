[package]
name = "tiffiny-effects"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "Databending and glitch effects for Tiffiny Studio"

[dependencies]
tiffiny-image = { path = "../image" }
tiffiny-video = { path = "../video" }
tiffiny-raw = { path = "../raw" }

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
num-traits = "0.2"
num-derive = "0.4"

rand = "0.8"

nalgebra = "0.32"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rustfft = "6.1"

noise = "0.8"

palette = "0.7"

imageproc = "0.23"

symphonia = { version = "0.5", features = ["all"] }

wgpu = { version = "0.19", optional = true }
pollster = "0.3"
