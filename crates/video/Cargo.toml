[package]
name = "tiffiny-video"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "Video processing and manipulation for Tiffiny Studio"

[dependencies]
ffmpeg-next = { version = "7.0", features = [
  "codec",
  "format",
  "filter",
  "software-scaling",
  "software-resampling",
] }

opencv = { version = "0.88", features = ["default", "clang-runtime", "imgproc", "imgcodecs"] }

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
num-derive = "0.4"

image = { version = "0.24", features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "tiff",
  "webp",
] }

tiffiny-audio = { path = "../audio" }

tiffiny-core = { path = "../core" }
