[package]
name = "tiffiny-cli"
version = "0.1.0"
edition = "2021"
authors = ["Tiffiny Studio Team"]
description = "Command-line interface for Tiffiny Studio"
license = "MIT"
repository = "https://github.com/tiffiny-studio/tiffiny"
keywords = ["cli", "command-line", "media", "databending"]
categories = ["command-line-utilities"]

[dependencies]
tiffiny-core = { path = "../core" }
tiffiny-app = { path = "../app" }
tiffiny-ui = { path = "../ui" }
tiffiny-audio = { path = "../audio" }
tiffiny-image = { path = "../image" }
tiffiny-video = { path = "../video" }
tiffiny-raw = { path = "../raw" }
tiffiny-convert = { path = "../convert" }
tiffiny-effects = { path = "../effects" }
tiffiny-gpu = { path = "../gpu" }
tiffiny-project = { path = "../project" }
tiffiny-utils = { path = "../utils" }

clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
clap_complete = "4.4"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
crossterm = "0.27"

tokio = { version = "1.35", features = ["full"] }

anyhow = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

glob = "0.3"
walkdir = "2.4"
tempfile = "3.8"

config = "0.13"

pbr = "1.1"

colored = "2.1"
termcolor = "1.4"

tabled = "0.15"

regex = "1.10"

reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "tiffiny-cli"
path = "src/main.rs"
