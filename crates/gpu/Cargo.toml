[package]
name = "tiffiny-gpu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/tiffiny"
homepage = "https://tiffiny.org"
description = "GPU compute shaders for Tiffiny Studio"

[dependencies]
wgpu = "0.19"
winit = "0.28"
pollster = "0.3"

tokio = { version = "1.0", features = ["full"] }

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"

parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
num-traits = "0.2"
num-derive = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

image = "0.24"

nalgebra = "0.32"

bytemuck = "1.14"
encase = "0.7"

tiffiny-core = { path = "../core" }
tiffiny-image = { path = "../image" }
tiffiny-video = { path = "../video" }
tiffiny-effects = { path = "../effects" }
